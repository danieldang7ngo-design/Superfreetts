[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# Runtime-error rules plus the import/assignment cleanup that is now complete.
# F401 is intentional in a few registration modules and is annotated with a
# local noqa at those call sites.
select = ["E9", "F821", "F811", "F401", "F541", "F841"]

[tool.coverage.run]
source = ["superfreetts_addon"]
omit = ["external/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
