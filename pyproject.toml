[project]
name = "SuperFreeTTS"
version = "26.8.11"
description = "Super Free TTS"
readme = "README.md"
requires-python = ">=3.9"

authors = [{ name = "Phuc" }]
license = { text = "GPL-3.0-only" }
keywords = ["anki", "addon", "text-to-speech", "tts"]

dependencies = []

[dependency-groups]
dev = [
    "aadt>=1.0.0",
    "ruff>=0.12.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.10",
    "coverage>=7.0",
]

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/superfreetts"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by ruff formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
