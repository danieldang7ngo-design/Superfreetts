name: Tests, lint and package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff (runtime errors and import hygiene)
        run: ruff check superfreetts_addon build_share.py scripts tests
      - name: i18n key coverage
        run: python scripts/i18n_audit.py --check --strict-locales en,vi

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit (medium/high severity gate)
        run: bandit -r superfreetts_addon -ll

  test:
    # Job names stay "test (3.x)": matrix.include keeps one job per version.
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is 26.04, which has no Python 3.9 build in
          # actions/python-versions (3.9.25 ships for 22.04/24.04 only).
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Coverage (overall floor and critical-module gate)
        run: |
          python -m pytest tests/ -q \
            --cov=superfreetts_addon \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=45
          python scripts/check_critical_coverage.py coverage.json

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q --tb=short

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Vendored dependency metadata
        run: python scripts/vendor_deps.py --check
      - name: Build add-on package
        run: python build_share.py
      - name: Verify package contents and clean import
        run: python scripts/verify_package.py SuperFreeTTS.ankiaddon
      - uses: actions/upload-artifact@v4
        with:
          name: SuperFreeTTS-ankiaddon
          path: SuperFreeTTS.ankiaddon
