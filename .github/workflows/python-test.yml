name: Tests, lint and package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff (runtime errors and import hygiene)
        run: ruff check superfreetts_addon build_share.py scripts tests
      - name: i18n key coverage
        run: python scripts/i18n_audit.py --check

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit (medium/high severity gate)
        run: bandit -r superfreetts_addon -ll

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Coverage (overall floor and critical-module gate)
        run: |
          python -m pytest tests/ -q \
            --cov=superfreetts_addon \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=33
          python scripts/check_critical_coverage.py coverage.json

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q --tb=short

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Vendored dependency metadata
        run: python scripts/vendor_deps.py --check
      - name: Build add-on package
        run: python build_share.py
      - name: Verify package contents and clean import
        run: python scripts/verify_package.py SuperFreeTTS.ankiaddon
      - uses: actions/upload-artifact@v4
        with:
          name: SuperFreeTTS-ankiaddon
          path: SuperFreeTTS.ankiaddon
