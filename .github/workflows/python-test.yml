name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Verify all main modules import cleanly
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tests import mock_anki
          mock_anki.mock_all()
          import superfreetts_addon.config_models
          import superfreetts_addon.audio_file_store
          import superfreetts_addon.text_utils
          import superfreetts_addon.source_text_resolver
          import superfreetts_addon.batch_constants
          import superfreetts_addon.batch_state_manager
          import superfreetts_addon.batch_executor
          import superfreetts_addon.service
          import superfreetts_addon.servicemanager
          print('All imports OK')
          "
